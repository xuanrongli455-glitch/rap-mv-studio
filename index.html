<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05010d" />
<title>3D 說唱 MV 工作室</title>
<link rel="stylesheet" href="./src/ui/panel.css" />
<style>
  :root {
    --bg: #05010d;
    --ink: #f2f0ff;
    --dim: #8b86a8;
    --line: rgba(255, 255, 255, 0.12);
    --hot: #ff2bd6;
    --cool: #00e5ff;
    --ok: #35f0a0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 46%, #14082c 0%, #05010d 55%, #000 100%);
  }
  /* 舞台：canvas 維持 1080x1920 內部解析度，用 CSS 縮放貼合螢幕 */
  #stage-wrap {
    position: relative; height: 100%; max-width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    transition: transform .35s ease;
  }
  #stage-canvas {
    display: block; width: 100%; height: 100%; object-fit: contain;
    background: #05010d; touch-action: none;
  }
  /* 頂部資訊 */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.65), transparent);
    font-size: 12px; letter-spacing: .04em;
  }
  #hud .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--dim);
    box-shadow: 0 0 8px currentColor; flex: 0 0 auto;
  }
  #hud.live .dot { background: var(--hot); color: var(--hot); animation: pulse 1s infinite; }
  #hud .name { color: var(--dim); text-transform: uppercase; }
  #hud .time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* 錄影倒數 / 完成提示 */
  #overlay {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(2, 0, 8, .82); backdrop-filter: blur(6px);
    text-align: center; padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay .count {
    font-size: clamp(72px, 22vw, 160px); font-weight: 800; line-height: 1;
    background: linear-gradient(180deg, var(--cool), var(--hot));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 43, 214, .45));
  }
  #overlay .msg { font-size: 14px; color: var(--dim); max-width: 34ch; line-height: 1.6; }
  #overlay .big { font-size: 22px; font-weight: 700; color: var(--ink); }

  /* 手機：面板從底部拉起，只露出把手 */
  #panel-toggle {
    position: fixed; z-index: 40; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 84px);
    width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(18, 10, 36, .82); color: var(--ink); font-size: 18px;
    backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center;
  }
  @media (max-width: 820px) {
    #panel-toggle { display: flex; }
    #panel { transform: translateY(calc(100% - 54px)); transition: transform .3s ease; }
    #panel.open { transform: translateY(0); }
  }
  #nogl {
    position: fixed; inset: 0; z-index: 100; display: none; place-items: center;
    background: #05010d; color: #fff; text-align: center; padding: 30px; line-height: 1.7;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="stage-wrap"><canvas id="stage-canvas"></canvas></div>
  </div>

  <div id="hud">
    <span class="dot"></span>
    <span class="name" id="hud-name">3D MV STUDIO</span>
    <span class="time" id="hud-time">0.0s</span>
  </div>

  <button id="panel-toggle" aria-label="設定">⚙︎</button>
  <aside id="panel"></aside>

  <div id="overlay">
    <div class="count" id="overlay-count"></div>
    <div class="big" id="overlay-big"></div>
    <div class="msg" id="overlay-msg"></div>
  </div>

  <div id="nogl">
    <div>
      <div style="font-size:20px;font-weight:700;margin-bottom:10px">這台裝置跑不動 WebGL</div>
      <div style="color:#8b86a8">請改用 Safari / Chrome 最新版開啟，或關掉省電/低耗電模式後重試。</div>
    </div>
  </div>

  <!-- 真機除錯用：任何未捕捉錯誤或模組載入失敗，直接顯示在畫面上（截圖即可回報） -->
  <div id="errbar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:999;
       max-height:42vh;overflow:auto;background:rgba(90,0,20,.94);color:#fff;
       font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
       border-top:1px solid rgba(255,80,120,.6);white-space:pre-wrap"></div>
  <script>
    (function () {
      var bar = document.getElementById('errbar');
      var shown = 0;
      function show(kind, msg) {
        if (!bar || shown > 6) return;
        shown++;
        bar.style.display = 'block';
        bar.textContent += '[' + kind + '] ' + msg + '\n';
        // 讓使用者可以一鍵複製錯誤
        bar.onclick = function () {
          navigator.clipboard && navigator.clipboard.writeText(bar.textContent).catch(function () {});
        };
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          show('資源載入失敗', (e.target.src || e.target.href) + '');
          return;
        }
        show('錯誤', (e && e.message ? e.message : String(e)) + (e && e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        show('Promise', r && r.message ? r.message : String(r));
      });
      // 把 console.error 與「shader / WebGL 相關」的警告也顯示出來：
      // 在 iPhone 上沒辦法開開發者工具，這是唯一能看到錯誤的方式。
      var origError = console.error.bind(console);
      var origWarn = console.warn.bind(console);
      console.error = function () {
        var s = Array.prototype.map.call(arguments, String).join(' ');
        origError.apply(null, arguments);
        show('console.error', s.slice(0, 400));
      };
      console.warn = function () {
        var s = Array.prototype.map.call(arguments, String).join(' ');
        origWarn.apply(null, arguments);
        if (/shader|program|glsl|webgl|not supported|unsupported|failed|error/i.test(s)) {
          show('console.warn', s.slice(0, 400));
        }
      };
      window.__MV_SHOW_ERROR__ = show;
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
